apiVersion: v1
kind: ServiceAccount
metadata:
  name: coordinator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: coordinator
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: coordinator
subjects:
  - kind: ServiceAccount
    name: coordinator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: coordinator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runyard-capacity-reader
rules:
  - apiGroups: ['']
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runyard-capacity-reader
subjects:
  - kind: ServiceAccount
    name: coordinator
    namespace: runyard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runyard-capacity-reader
