apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector: {app: server}
  ports:
    - {name: http, port: 8080, targetPort: http}
    - {name: grpc, port: 9090, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: server}
  template:
    metadata:
      labels: {app: server}
    spec:
      serviceAccountName: coordinator
      securityContext: {runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true}
      terminationGracePeriodSeconds: 60
      containers:
        - name: server
          image: runyard-server:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: runyard-config}
            - secretRef: {name: runyard-secrets}
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 9090}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: '2', memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health/ready, port: http, scheme: HTTPS}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http, scheme: HTTPS}
            initialDelaySeconds: 10
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: artifacts, mountPath: /work/artifacts}
            - {name: tls, mountPath: /etc/runyard/tls, readOnly: true}
      volumes:
        - name: artifacts
          emptyDir: {}
        - name: tls
          secret: {secretName: runyard-tls, optional: true}
