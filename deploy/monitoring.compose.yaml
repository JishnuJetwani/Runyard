services:
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: [--config.file=/etc/prometheus/prometheus.yaml, --storage.tsdb.retention.time=7d]
    volumes:
      - ./deploy/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/monitoring/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus:/prometheus
    ports: [127.0.0.1:9091:9090]
    networks: [runyard]
  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    environment:
      GF_SECURITY_ADMIN_USER: runyard
      GF_SECURITY_ADMIN_PASSWORD: ${RUNYARD_GRAFANA_PASSWORD:?Run scripts/dev-setup.sh first}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: [127.0.0.1:3001:3000]
    networks: [runyard]
volumes:
  prometheus:
  grafana:
