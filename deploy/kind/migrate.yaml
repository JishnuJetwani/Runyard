apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: runyard
spec:
  # Service routing may settle just after PostgreSQL first becomes ready.
  backoffLimit: 3
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: runyard-server:dev
          imagePullPolicy: IfNotPresent
          args: [migrate, --directory, /opt/runyard/migrations]
          envFrom: [{secretRef: {name: runyard-secrets}}]
