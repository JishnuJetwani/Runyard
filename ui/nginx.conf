server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # Browser credentials pass through to the coordinator. The static image
    # contains no owner key and gives unauthenticated requests no extra authority.
    location /v1/ {
        proxy_pass http://server:8080;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }
    location /health/ {
        proxy_pass http://server:8080;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
