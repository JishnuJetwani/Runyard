name: runyard
x-server-env: &server-env
  RUNYARD_PROFILE: development
  RUNYARD_DATABASE_URL: host=postgres user=runyard password=runyard-local-only dbname=runyard connect_timeout=3
  RUNYARD_OWNER_TOKEN: ${RUNYARD_OWNER_TOKEN:?Run scripts/dev-setup.sh first}
  RUNYARD_WORKER_TOKEN: ${RUNYARD_WORKER_TOKEN:?Run scripts/dev-setup.sh first}
  RUNYARD_SIGNING_KEY: ${RUNYARD_SIGNING_KEY:?Run scripts/dev-setup.sh first}
  RUNYARD_BIND: 0.0.0.0
  RUNYARD_ARTIFACT_ROOT: /work/artifacts
x-agent: &agent
  image: runyard-agent:dev
  build: {context: ., dockerfile: deploy/docker/Dockerfile, target: agent}
  depends_on:
    server: {condition: service_started}
  volumes: [/var/run/docker.sock:/var/run/docker.sock]
  networks: [runyard]
x-agent-env: &agent-env
  RUNYARD_PROFILE: development
  RUNYARD_COORDINATOR: server:9090
  RUNYARD_WORKER_TOKEN: ${RUNYARD_WORKER_TOKEN}
  RUNYARD_CPU_MILLIS: 1000
  RUNYARD_MEMORY_MIB: 1024
services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment: {POSTGRES_USER: runyard, POSTGRES_PASSWORD: runyard-local-only, POSTGRES_DB: runyard}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, pg_isready -U runyard], interval: 2s, timeout: 3s, retries: 30}
    networks: [runyard]
  migrate:
    image: runyard-server:dev
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: server}
    command: [migrate, --directory, /opt/runyard/migrations]
    environment: *server-env
    depends_on:
      postgres: {condition: service_healthy}
    networks: [runyard]
  server:
    image: runyard-server:dev
    build: {context: ., dockerfile: deploy/docker/Dockerfile, target: server}
    environment: *server-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: [127.0.0.1:8080:8080, 127.0.0.1:9090:9090]
    volumes: [artifacts:/work/artifacts]
    networks: [runyard]
  agent-1:
    <<: *agent
    environment: {<<: *agent-env, RUNYARD_WORKER_ID: local-1}
  agent-2:
    <<: *agent
    environment: {<<: *agent-env, RUNYARD_WORKER_ID: local-2}
  agent-3:
    <<: *agent
    environment: {<<: *agent-env, RUNYARD_WORKER_ID: local-3}
  registry:
    image: registry:2.8.3
    ports: [127.0.0.1:5001:5000]
    volumes: [registry:/var/lib/registry]
    networks: [runyard]
networks:
  runyard: {name: runyard}
volumes:
  postgres:
  artifacts:
  registry:
