openapi: 3.0.3
info:
  title: Runyard API
  version: 0.1.0
  description: Run experiments for one trusted owner. Errors contain code, message, and request_id.
    Health and metrics routes do not require authentication; keep them on a private network.
    Timestamps include UTC offsets. Run and worker lists use ID cursors; page until items is empty.
    Lists may change while you read them.
servers:
- url: https://localhost:8080
  description: Private TLS deployment through port forwarding
- url: http://localhost:8080
  description: Local development only
security:
- ownerToken: []
paths:
  /v1/runs:
    post:
      operationId: submitRun
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSpec'
      description: Save a run with a specification that cannot change. Reusing a request key with a
        different normalized specification returns 409.
    get:
      operationId: listRuns
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - in: query
        name: after
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - QUEUED
          - STARTING
          - RUNNING
          - FINALIZING
          - RETRY_WAIT
          - SUCCEEDED
          - FAILED
          - CANCELLED
  /v1/runs/{id}:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      operationId: getRun
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/runs/{id}/attempts:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      operationId: listAttempts
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPage'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: All attempts in generation order; bounded by max_attempts (10 maximum).
  /v1/runs/{id}/events:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      operationId: listEvents
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: after
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      description: Resume after the last returned event sequence. Sequence allocation is transactional
        per run.
  /v1/runs/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelRun
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: The first committed completion or cancellation wins. Check attempt cleanup_status
        to confirm the process has stopped; CANCELLED can still have pending cleanup.
  /v1/runs/{id}/rerun:
    parameters:
    - $ref: '#/components/parameters/RunId'
    post:
      operationId: rerunRun
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      description: Creates a linked immutable run from a terminal run. The original remains unchanged.
  /v1/sweeps:
    post:
      operationId: submitSweep
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sweep'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SweepSpec'
      description: Atomically expands a parameter grid; at most 1000 runs and 16 MiB estimated expanded
        specifications.
  /v1/sweeps/{id}:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      operationId: getSweep
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sweep'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/runs/{id}/logs:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      operationId: listLogs
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPage'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: attempt
        schema:
          type: string
      - in: query
        name: after
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      description: Defaults to the current attempt, including the accepted successful result. Explicit
        attempt selects historical output. Cursors are attempt-scoped; reset when attempt_id changes.
        Logs are followed by approximately one-second polling.
  /v1/runs/{id}/metrics:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      operationId: listMetrics
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryPage'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: attempt
        schema:
          type: string
      - in: query
        name: after
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - in: query
        name: name
        schema:
          type: string
      description: Defaults to the current attempt, including the accepted successful result. Explicit
        attempt selects historical output. Cursors are attempt-scoped; reset when attempt_id changes.
        Logs are followed by approximately one-second polling.
  /v1/runs/{id}/artifacts:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      operationId: listArtifacts
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactPage'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: attempt
        schema:
          type: string
      description: At most 1000 artifacts per attempt. Defaults to the current/accepted attempt; historical
        attempt output remains available.
  /v1/artifacts/{id}:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      operationId: getArtifact
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/artifacts/{id}/download:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      operationId: downloadArtifact
      responses:
        '200':
          description: Complete artifact bytes; verify size and SHA-256 from metadata.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/workers:
    get:
      operationId: listWorkers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerPage'
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - in: query
        name: after
        schema:
          type: string
  /v1/workers/{id}/drain:
    parameters:
    - $ref: '#/components/parameters/RunId'
    post:
      operationId: drainWorker
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  drained:
                    type: boolean
                required:
                - id
                - drained
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                drained:
                  type: boolean
                  default: true
      description: Stop new Docker assignments while preserving live attempts. Set drained=false to resume.
  /health/live:
    get:
      operationId: getStatus
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required:
                - status
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /health/ready:
    get:
      operationId: getReady
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                required:
                - ready
        default:
          description: Error code, message, and request ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'Not ready: database leadership unavailable'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                required:
                - ready
      security: []
  /metrics:
    get:
      operationId: getOperationalMetrics
      security: []
      responses:
        '200':
          description: Prometheus exposition, on the private listener
          content:
            text/plain:
              schema:
                type: string
  /v1/capacity:
    get:
      summary: Inspect GPU capacity and reservations
      description: Returns deployment totals and a page of worker or node details. Stale availability
        is null. Kubernetes availability estimates free resources on eligible nodes; it does not guarantee placement.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - name: after
        in: query
        schema:
          type: string
      responses:
        '200':
          description: GPU capacity snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityPage'
        '400':
          description: Invalid pagination
        '401':
          description: Owner credentials required
components:
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
  parameters:
    RunId:
      in: path
      name: id
      required: true
      schema:
        type: string
  schemas:
    RunSpec:
      type: object
      additionalProperties: false
      required:
      - name
      - image
      - command
      properties:
        version:
          type: integer
          enum:
          - 1
          default: 1
        name:
          type: string
          minLength: 1
          maxLength: 200
        image:
          type: string
          description: Immutable image reference ending in '@sha256:<64 lowercase hex digits>'
          maxLength: 1024
        command:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: string
            maxLength: 16384
        parameters:
          type: object
          description: Flat scalar values
          maxProperties: 100
          additionalProperties:
            $ref: '#/components/schemas/Scalar'
        environment:
          type: object
          additionalProperties:
            type: string
          maxProperties: 100
        labels:
          type: object
          additionalProperties:
            type: string
          maxProperties: 50
        resources:
          type: object
          properties:
            cpu_millis:
              type: integer
              minimum: 1
              default: 1000
              maximum: 1000000
            gpu_count:
              type: integer
              minimum: 0
              maximum: 64
              default: 0
              description: Whole NVIDIA GPUs on one worker or node.
            memory_mib:
              type: integer
              minimum: 32
              default: 512
              maximum: 1048576
          additionalProperties: false
        retry:
          type: object
          properties:
            max_attempts:
              type: integer
              minimum: 1
              maximum: 10
              default: 3
            retry_exit:
              type: boolean
              default: false
            retry_timeout:
              type: boolean
              default: false
          additionalProperties: false
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 604800
          default: 1800
        priority:
          type: integer
          minimum: 0
          maximum: 9
          default: 0
        source:
          type: object
          properties:
            repository:
              type: string
            revision:
              type: string
          additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
          required:
          - code
          - message
          - request_id
      required:
      - error
    Run:
      type: object
      properties:
        id:
          type: string
        active_attempt:
          type: string
        sweep_id:
          type: string
        parent_run_id:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        status:
          type: string
          enum:
          - QUEUED
          - STARTING
          - RUNNING
          - FINALIZING
          - RETRY_WAIT
          - SUCCEEDED
          - FAILED
          - CANCELLED
        generation:
          type: integer
          format: int64
        spec:
          $ref: '#/components/schemas/RunSpec'
      required:
      - id
      - active_attempt
      - sweep_id
      - parent_run_id
      - created_at
      - updated_at
      - status
      - generation
      - spec
    Attempt:
      type: object
      properties:
        id:
          type: string
        run_id:
          type: string
        worker_id:
          type: string
        status:
          type: string
        reason:
          type: string
        runtime_id:
          type: string
        cleanup_status:
          type: string
        created_at:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        generation:
          type: integer
          format: int64
        acknowledged_sequence:
          type: integer
          format: int64
        exit_code:
          type: integer
          nullable: true
        gpu_count:
          type: integer
          format: int64
          minimum: 0
        node_name:
          type: string
        gpu_allocations:
          type: array
          items:
            $ref: '#/components/schemas/GpuAllocation'
      required:
      - id
      - run_id
      - worker_id
      - status
      - reason
      - runtime_id
      - cleanup_status
      - created_at
      - started_at
      - finished_at
      - generation
      - acknowledged_sequence
      - exit_code
    Event:
      type: object
      properties:
        sequence:
          type: integer
          format: int64
        kind:
          type: string
        detail:
          type: string
        created_at:
          type: string
      required:
      - sequence
      - kind
      - detail
      - created_at
    Telemetry:
      type: object
      properties:
        sequence:
          type: integer
          format: int64
        kind:
          type: string
          enum:
          - stdout
          - stderr
          - notice
          - metric
        text:
          type: string
        name:
          type: string
        step:
          type: integer
          format: int64
        value:
          type: number
        timestamp_ms:
          type: integer
          format: int64
      required:
      - sequence
      - kind
      - text
      - name
      - step
      - value
      - timestamp_ms
    Artifact:
      type: object
      properties:
        id:
          type: string
        attempt_id:
          type: string
        path:
          type: string
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size:
          type: integer
          format: int64
      required:
      - id
      - attempt_id
      - path
      - sha256
      - size
    Resources:
      type: object
      properties:
        cpu_millis:
          type: integer
          minimum: 1
          maximum: 1000000
        memory_mib:
          type: integer
          minimum: 32
          maximum: 1048576
        gpu_count:
          type: integer
          format: int64
          minimum: 0
      required:
      - cpu_millis
      - memory_mib
    Worker:
      type: object
      properties:
        id:
          type: string
        capacity:
          $ref: '#/components/schemas/Resources'
        reserved:
          type: object
          properties:
            cpu_millis:
              type: integer
              format: int64
            memory_mib:
              type: integer
              format: int64
            gpu_count:
              type: integer
              format: int64
              minimum: 0
          required:
          - cpu_millis
          - memory_mib
        drained:
          type: boolean
        available:
          type: boolean
        heartbeat_at:
          type: string
        gpu_inventory:
          type: object
          properties:
            capable:
              type: boolean
            ready:
              type: boolean
            fresh:
              type: boolean
            observed_at:
              type: string
            devices:
              type: array
              items:
                $ref: '#/components/schemas/GpuDevice'
            available_estimate:
              type: integer
              format: int64
              minimum: 0
              nullable: true
          required:
          - capable
          - ready
          - fresh
          - observed_at
          - devices
          - available_estimate
      required:
      - id
      - capacity
      - reserved
      - drained
      - available
      - heartbeat_at
    Scalar:
      oneOf:
      - type: string
        nullable: true
      - type: boolean
      - type: number
    SweepSpec:
      type: object
      properties:
        base:
          $ref: '#/components/schemas/RunSpec'
        grid:
          type: object
          additionalProperties:
            type: array
            minItems: 1
            maxItems: 1000
            items:
              $ref: '#/components/schemas/Scalar'
      required:
      - base
      - grid
      additionalProperties: false
    Sweep:
      type: object
      properties:
        id:
          type: string
        spec:
          $ref: '#/components/schemas/SweepSpec'
        run_ids:
          type: array
          maxItems: 1000
          items:
            type: string
        created_at:
          type: string
      required:
      - id
      - spec
      - run_ids
      - created_at
    RunPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Run'
        next_cursor:
          type: string
      required:
      - items
      - next_cursor
    WorkerPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Worker'
        next_cursor:
          type: string
      required:
      - items
      - next_cursor
    AttemptPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Attempt'
      required:
      - items
    ArtifactPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
      required:
      - items
    EventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
      required:
      - items
    TelemetryPage:
      type: object
      properties:
        attempt_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Telemetry'
        next_cursor:
          type: integer
          format: int64
      required:
      - attempt_id
      - items
      - next_cursor
    GpuDevice:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        memory_mib:
          type: integer
          format: int64
          minimum: 0
        eligible:
          type: boolean
        reason:
          type: string
      required:
      - uuid
      - name
      - memory_mib
      - eligible
      - reason
    GpuAllocation:
      type: object
      properties:
        device:
          $ref: '#/components/schemas/GpuDevice'
        allocated_at:
          type: string
        released_at:
          type: string
      required:
      - device
      - allocated_at
      - released_at
    GpuCapacity:
      type: object
      properties:
        capacity:
          type: integer
          format: int64
          minimum: 0
        allocatable:
          type: integer
          format: int64
          minimum: 0
        reserved:
          type: integer
          format: int64
          minimum: 0
        available_estimate:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        pending:
          type: integer
          format: int64
          minimum: 0
        fresh:
          type: boolean
        observed_at:
          type: string
        age_seconds:
          type: integer
          format: int64
          minimum: 0
          nullable: true
      required:
      - capacity
      - allocatable
      - reserved
      - available_estimate
      - pending
      - fresh
      - observed_at
      - age_seconds
    GpuNodeCapacity:
      type: object
      properties:
        name:
          type: string
        capacity:
          type: integer
          format: int64
          minimum: 0
        allocatable:
          type: integer
          format: int64
          minimum: 0
        reserved:
          type: integer
          format: int64
          minimum: 0
        ready:
          type: boolean
        schedulable:
          type: boolean
        eligible:
          type: boolean
        available_estimate:
          type: integer
          format: int64
          minimum: 0
          nullable: true
      required:
      - name
      - capacity
      - allocatable
      - reserved
      - ready
      - schedulable
      - eligible
      - available_estimate
    CapacityPage:
      type: object
      properties:
        backend:
          type: string
