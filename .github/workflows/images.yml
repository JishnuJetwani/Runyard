name: release-images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable release tag (for example v0.1.0)
        required: true
        type: string
      publish:
        description: Publish images to GHCR after building both native architectures
        default: false
        type: boolean
permissions:
  contents: read
  packages: write
jobs:
  images:
    strategy:
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Resolve image names
        env: {RELEASE_VERSION: '${{ inputs.version }}'}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,80}$ ]]
          echo "IMAGE_ROOT=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: server
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.publish }}
          tags: ${{ env.IMAGE_ROOT }}/server:${{ inputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=runyard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runyard-${{ matrix.arch }}
      - name: Build agent
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: agent
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.publish }}
          tags: ${{ env.IMAGE_ROOT }}/agent:${{ inputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=runyard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runyard-${{ matrix.arch }}
      - name: Build runner-base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: runner-base
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.publish }}
          tags: ${{ env.IMAGE_ROOT }}/runner-base:${{ inputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=runyard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runyard-${{ matrix.arch }}
      - name: Build fixture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: fixture
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.publish }}
          tags: ${{ env.IMAGE_ROOT }}/fixture:${{ inputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=runyard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runyard-${{ matrix.arch }}
      - name: Build cli
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: cli
          platforms: linux/${{ matrix.arch }}
          push: ${{ inputs.publish }}
          tags: ${{ env.IMAGE_ROOT }}/cli:${{ inputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=runyard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runyard-${{ matrix.arch }}
  manifests:
    if: inputs.publish
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env: {RELEASE_VERSION: '${{ inputs.version }}'}
        run: |
          root="ghcr.io/${GITHUB_REPOSITORY,,}"
          for target in server agent runner-base fixture cli; do
            docker buildx imagetools create -t "$root/$target:$RELEASE_VERSION" "$root/$target:$RELEASE_VERSION-amd64" "$root/$target:$RELEASE_VERSION-arm64"
          done
