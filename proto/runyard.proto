syntax = "proto3";
package runyard.rpc.v1;

message Empty {}
message WorkerIdentity { string id = 1; string session = 2; }
message RegisterRequest { WorkerIdentity worker = 1; int32 cpu_millis = 2; int32 memory_mib = 3; }
message Owner { string attempt_id = 1; int32 generation = 2; string instance_id = 3; }
message WorkAssignment { string attempt_id = 1; string run_id = 2; int32 generation = 3; string specification_json = 4; string capability = 5; }
message WorkReply { bool has_work = 1; WorkAssignment assignment = 2; repeated string cleanup_attempts = 3; }
message Inventory { WorkerIdentity worker = 1; repeated string attempts = 2; }
message Decisions { repeated string stop_attempts = 1; }
message RuntimeReport { WorkerIdentity worker = 1; string attempt_id = 2; string runtime_id = 3; bool stopped = 4; }
message StartReply { string specification_json = 1; int32 lease_seconds = 2; int32 heartbeat_seconds = 3; int32 termination_seconds = 4; int32 finalization_seconds = 5; }
message Ack { int64 sequence = 1; int32 lease_seconds = 2; }
message TelemetryRecord { int64 sequence = 1; string kind = 2; string text = 3; string name = 4; int64 step = 5; double value = 6; int64 timestamp_ms = 7; }
message TelemetryBatch { Owner owner = 1; repeated TelemetryRecord records = 2; }
message ArtifactChunk { Owner owner = 1; string path = 2; bytes data = 3; string sha256 = 4; }
message ArtifactReply { string id = 1; string sha256 = 2; uint64 size = 3; }
message Completion { Owner owner = 1; int32 exit_code = 2; string reason = 3; int64 final_sequence = 4; }

service AgentService {
  rpc Reconcile(Inventory) returns (Decisions);
  rpc Register(RegisterRequest) returns (Empty);
  rpc Heartbeat(WorkerIdentity) returns (Empty);
  rpc Poll(WorkerIdentity) returns (WorkReply);
  rpc ReportRuntime(RuntimeReport) returns (Empty);
}
service AttemptService {
  rpc Start(Owner) returns (StartReply);
  rpc Heartbeat(Owner) returns (Ack);
  rpc Report(TelemetryBatch) returns (Ack);
  rpc BeginFinalization(Owner) returns (Empty);
  rpc Upload(stream ArtifactChunk) returns (ArtifactReply);
  rpc Complete(Completion) returns (Empty);
}
